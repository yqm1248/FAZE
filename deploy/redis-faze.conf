# 法泽 FAZE 专用 Redis 服务配置（段 0 A2）
# 来源：E:\Redis-x64-5.0.14.1\redis.windows-service.conf 的副本，改了三处绝对路径：
#   dir / logfile / dbfilename 都落到 Redis 安装目录，避免 Windows 服务以 System32 为 CWD 时把 dump.rdb 写丢。
# 注册方式（管理员）：
#   & "E:\Redis-x64-5.0.14.1\redis-server.exe" --service-install "E:\dshcode\FAZE\deploy\redis-faze.conf" --service-name Redis
# 卸载方式（管理员）：
#   & "E:\Redis-x64-5.0.14.1\redis-server.exe" --service-uninstall --service-name Redis

bind 127.0.0.1
port 6379
dir E:\Redis-x64-5.0.14.1
logfile E:\Redis-x64-5.0.14.1\faze-redis.log
dbfilename dump.rdb

# ── 持久化（2026-11-13 新增，修 DEF-017 的根因）────────────────────────
# 原配置 save 为空 + appendonly no = **零持久化**（实测 `CONFIG GET save` 返回空、
# `CONFIG GET appendonly` 返回 no）。
# 后果：Redis 服务一重启，db1 的 faze:seq:* 当日序号全丢，单号从 000001 重来，
# 与库内历史单号撞 uk_*_no 唯一键 → 当天新业务全报 HTTP 200 + 401005「资源已存在」。
# 单号是业务主键级数据，不能「重启即丢」，所以开双重持久化：
#   RDB：定期快照，崩溃/误删后的恢复点（三档沿用 Redis 默认值，不额外加压）
#   AOF：逐秒落盘，丢失窗口 ≤1 秒 —— RDB 单独不够，两次快照之间的序号照样会丢
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 库号分配（2026-11-13 改正：原注释写「段 0/1 用独立 db 14」，与实现不符）
#   db 0 = RuoYi 登录态（sys_dict:* / sys_config:*）
#   db 1 = faze 业务（faze:seq:* 等）—— 由 application-dev.yml 的
#          spring.data.redis.database: ${FAZE_REDIS_DATABASE:1} 决定
# **库号不由 FAZE_REDIS_URL 的 path 决定**：该 URL 只被 deploy/start-services.ps1:146
# 与 deploy/verify-all.ps1:74 用正则 `^redis://([^/:]+):(\d+)` 取 host:port，
# `/14` 段被正则丢弃，对任何组件都不产生作用（登记为 DRIFT-050）。
databases 16
