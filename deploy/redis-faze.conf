# 法泽 FAZE 专用 Redis 服务配置（段 0 A2）
# 来源：E:\Redis-x64-5.0.14.1\redis.windows-service.conf 的副本，改了三处绝对路径：
#   dir / logfile / dbfilename 都落到 Redis 安装目录，避免 Windows 服务以 System32 为 CWD 时把 dump.rdb 写丢。
# 注册方式（管理员）：
#   & "E:\Redis-x64-5.0.14.1\redis-server.exe" --service-install "E:\dshcode\FAZE\deploy\redis-faze.conf" --service-name Redis
# 卸载方式（管理员）：
#   & "E:\Redis-x64-5.0.14.1\redis-server.exe" --service-uninstall --service-name Redis

bind 127.0.0.1
port 6379
dir E:\Redis-x64-5.0.14.1
logfile E:\Redis-x64-5.0.14.1\faze-redis.log
dbfilename dump.rdb

# 段 0/1 用独立 db 14（见 deploy/.env.example 的 FAZE_REDIS_URL）
databases 16
