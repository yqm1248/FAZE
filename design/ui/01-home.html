<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>首页</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ==========================================================================
   首页（Tab 1）—— 复刻原项目 pages/index/index.vue
   版式：浅蓝渐变 hero + 负边距压上去的 AI 解答卡 + 每日学法卡
   与原图差异（第 1 批已记录）：图标由位图改为线性 SVG，保留青/蓝/橙三色
   ========================================================================== */

.hero {
  background: linear-gradient(180deg, var(--banner-start) 0%, var(--banner-end) 100%);
  height: 252px;
  padding: calc(var(--statusbar-h) + 20px) var(--sp-xl) 0;
}

.hero__greeting {
  font-size: var(--fs-md);
  color: var(--text-body);
  line-height: var(--lh-normal);
}

.hero__title {
  margin-top: var(--sp-xs);
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: var(--lh-tight);
  letter-spacing: -0.02em;
}

.hero__sub {
  margin-top: var(--sp-sm);
  font-size: var(--fs-md);
  color: var(--text-secondary);
  line-height: var(--lh-normal);
}

.content {
  padding: 0 var(--sp-xl);
  margin-top: -76px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
}

/* ---------- AI 解答卡 ---------- */
.ai-card {
  padding: var(--sp-lg) var(--sp-lg) var(--sp-xl);
}

.ai-card__title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  color: var(--brand-accent);
  line-height: var(--lh-tight);
}

.ai-card__search {
  margin-top: var(--sp-md);
  height: var(--input-h);
  border-radius: var(--r-sm);
  background: var(--bg-input);
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: 0 var(--sp-md);
  color: var(--text-muted);
}

.ai-card__search svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.ai-card__search span {
  font-size: var(--fs-md);
}

.quick-grid {
  margin-top: var(--sp-lg);
  display: flex;
  gap: 10px;
}

.quick-grid__item {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  padding: var(--sp-md) 4px var(--sp-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-xs);
  text-decoration: none;
  color: var(--text-body);
  transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.quick-grid__item:active {
  background: var(--bg-canvas);
}

.quick-grid__item svg {
  width: 30px;
  height: 30px;
}

.quick-grid__label {
  font-size: var(--fs-caption);
  font-weight: var(--fw-bold);
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}

/* ---------- 每日学法卡 ---------- */
.law-card {
  padding: var(--sp-lg) var(--sp-lg) var(--sp-xs);
}

.law-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.law-card__title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: var(--lh-tight);
}

.law-card__more {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  margin-block: -9px;
  text-decoration: none;
}

.law-card__more span {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--border-outline);
  border-radius: var(--r-xs);
  color: var(--text-secondary);
  font-size: var(--fs-caption);
}

.law-list {
  margin-top: var(--sp-xs);
}

.law-list__item {
  display: block;
  padding: var(--sp-lg) 0 var(--sp-md);
  border-block-end: 1px solid var(--border-divider);
  text-decoration: none;
}

.law-list__item:last-child {
  border-block-end: 0;
}

.law-list__title {
  font-size: var(--fs-md);
  color: var(--text-body);
  line-height: var(--lh-relaxed);
}

.law-list__meta {
  margin-top: var(--sp-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  color: var(--text-muted);
}

.law-list__dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-muted);
}
</style>
</head>
