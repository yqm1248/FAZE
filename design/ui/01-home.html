/* ==========================================================================
   首页（Tab 1）—— 复刻原项目 pages/index/index.vue
   版式：浅蓝渐变 hero + 负边距压上去的 AI 解答卡 + 每日学法卡
   与原图差异（第 1 批已记录）：图标由位图改为线性 SVG，保留青/蓝/橙三色
   ========================================================================== */

.hero {
  position: relative;
  background: linear-gradient(180deg, var(--banner-start) 0%, var(--banner-end) 100%);
  height: 252px;
  padding: calc(var(--statusbar-h) + 20px) var(--sp-xl) 0;
}

/* ---------- 律师工作台快捷图标（仅认证律师可见，第 17 批） ----------
   ★ 为什么放在英雄区右上角：这是律师回来看「有没有新活」的入口，
     优先级高于页面上任何一个内容卡。放右上角是 iOS 里「账号 / 模式」
     类入口的固定位置，律师不需要学。
   ★ 只在已认证时出现。未认证的人看到一个进不去的图标，
     点了会被弹回，比没有这个图标更糟。 */
.wb-entry {
  position: absolute;
  inset-block-start: calc(var(--statusbar-h) + 12px);
  inset-inline-end: var(--sp-xl);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-surface);
  color: var(--brand-primary-pressed);
  box-shadow: var(--shadow-card);
  text-decoration: none;
}

.wb-entry svg {
  width: 22px;
  height: 22px;
}

/* 有未读待办时右上角点一个红点：这是「有新活」的信号，
   律师一天会扫这个图标十几次 */
.wb-entry::after {
  content: "";
  position: absolute;
  inset-block-start: 9px;
  inset-inline-end: 9px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--state-danger);
  box-shadow: 0 0 0 2px var(--bg-surface);
}

/* ---------- 角色入口条（第 17 批） ----------
   未认证 → 律师入驻认证；已认证 → 进入律师工作台。
   两态用同一位置、同一形态，只换内容 —— 用户认证前后不会觉得
   「多了个东西」或「少了个东西」。 */
.role-entry {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  width: 100%;
  padding: var(--sp-md) var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
  text-decoration: none;
  color: inherit;
}

.role-entry__icon {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

.role-entry__icon svg {
  width: 21px;
  height: 21px;
}

/* 入驻引导：暖色，是「有个事你可以做」的语气 */
.role-entry--join .role-entry__icon {
  background: var(--state-warning-soft);
  color: var(--state-warning-deep);
}

/* 工作台入口：主色，是「你的地盘」的语气 */
.role-entry--workbench .role-entry__icon {
  background: var(--brand-primary-soft);
  color: var(--brand-primary-pressed);
}

.role-entry__body {
  flex: 1 1 auto;
  min-width: 0;
}

.role-entry__title {
  display: block;
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.4;
}

.role-entry__desc {
  display: block;
  margin-block-start: 2px;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
}

.role-entry__chevron {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
}

.hero__greeting {
  font-size: var(--fs-md);
  color: var(--text-body);
  line-height: var(--lh-normal);
}

.hero__title {
  margin-top: var(--sp-xs);
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: var(--lh-tight);
  letter-spacing: -0.02em;
}

.hero__sub {
  margin-top: var(--sp-sm);
  font-size: var(--fs-md);
  color: var(--text-secondary);
  line-height: var(--lh-normal);
}

.content {
  padding: 0 var(--sp-xl);
  margin-top: -76px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
}

/* ---------- AI 解答卡 ---------- */
.ai-card {
  padding: var(--sp-lg) var(--sp-lg) var(--sp-xl);
}

.ai-card__title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  color: var(--brand-accent);
  line-height: var(--lh-tight);
}

.ai-card__search {
  margin-top: var(--sp-md);
  height: var(--input-h);
  border-radius: var(--r-sm);
  background: var(--bg-input);
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: 0 var(--sp-md);
  color: var(--text-muted);
}

.ai-card__search svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.ai-card__search span {
  font-size: var(--fs-md);
}

.quick-grid {
  margin-top: var(--sp-lg);
  display: flex;
  gap: 10px;
}

.quick-grid__item {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-sm);
  padding: var(--sp-md) 4px var(--sp-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-xs);
  text-decoration: none;
  color: var(--text-body);
  transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.quick-grid__item:active {
  background: var(--bg-canvas);
}

.quick-grid__item svg {
  width: 30px;
  height: 30px;
}

.quick-grid__label {
  font-size: var(--fs-caption);
  font-weight: var(--fw-bold);
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}

/* ---------- 快捷功能区 ---------- */
.quick-actions {
  padding: var(--sp-md) var(--sp-xs);
}

.quick-actions__grid {
  display: flex;
}

.quick-actions__item {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--sp-sm) 2px;
  text-decoration: none;
  color: var(--text-body);
  border-radius: var(--r-sm);
}

.quick-actions__item:active {
  background: var(--bg-canvas);
}

.quick-actions__item svg {
  width: 26px;
  height: 26px;
  color: var(--brand-primary);
}

.quick-actions__label {
  font-size: var(--fs-caption);
  line-height: 1.2;
  white-space: nowrap;
}

/* ---------- 每日学法卡 ---------- */
.law-card {
  padding: var(--sp-lg) var(--sp-lg) var(--sp-xs);
}

.law-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.law-card__title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: var(--lh-tight);
}

.law-card__more {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  margin-block: -9px;
  text-decoration: none;
}

.law-card__more span {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--border-outline);
  border-radius: var(--r-xs);
  color: var(--text-secondary);
  font-size: var(--fs-caption);
}

.law-list {
  margin-top: var(--sp-xs);
}

.law-list__item {
  display: block;
  padding: var(--sp-lg) 0 var(--sp-md);
  border-block-end: 1px solid var(--border-divider);
  text-decoration: none;
}

.law-list__item:last-child {
  border-block-end: 0;
}

.law-list__title {
  font-size: var(--fs-md);
  color: var(--text-body);
  line-height: var(--lh-relaxed);
}

.law-list__meta {
  margin-top: var(--sp-sm);
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  color: var(--text-muted);
}

.law-list__dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-muted);
}

/* ★ 本页没引 components.css（第 1 批页面自带全部样式），所以 [hidden] 的
   全局规则也不在。HTML 的 hidden 属性只是 UA 样式表里的 display: none，
   优先级最低 —— 页面里只要写了 .某个类 { display: flex }，hidden 就失效。
   01-home 的角色入口条正是这么同时冒出两条来的。这条必须补。注意注释里不能写 style 的结束标签——浏览器会提前结束样式表。 */
[hidden] {
  display: none !important;
}
</style>
