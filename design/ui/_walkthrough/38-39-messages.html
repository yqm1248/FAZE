<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走查 · 消息中心三态</title>
<style>
/* ==========================================================================
   走查页：第 10 批（38 消息中心）的三个非主态
   ==========================================================================
   用途：画布一屏只显示主态，其余状态集中在这里看。

   注意：
     1. 不是交付屏，放在 _walkthrough/，不上画布、不计入交付屏
     2. 状态靠 data-state 切换（#state-loading / #state-empty / #state-error）
     3. 必须用 HTTP 打开（端口 8123），file:// 下 iframe 的 hash 不生效

   核对要点：
     loading —— 骨架与真实条目同高，加载完不跳版
     empty   —— 不给「去逛逛」这类不沾边的按钮：消息是等来的，不是逛出来的
     error   —— 说明里交代「未读状态不会丢」，否则用户会担心漏消息
   39 消息详情不做四态（内容在打开时就定了），所以这个文件只有 38 的三态。
   ========================================================================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px;
  background: #EDEFF3;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #1A1A1A;
}

.walk {
  display: grid;
  grid-template-columns: repeat(2, 390px);
  gap: 24px 28px;
  justify-content: center;
}

.walk__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.walk__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.walk__name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}

.walk__tag {
  font-size: 11px;
  font-weight: 500;
  color: #4A66EE;
  background: #EEF2FF;
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.5;
}

.walk__note {
  font-size: 12px;
  color: #63696E;
  line-height: 1.6;
  max-width: 390px;
}

iframe {
  width: 390px;
  height: 844px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>

<div class="walk">

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">消息中心 · 加载中</h2>
      <span class="walk__tag">loading</span>
    </div>
    <p class="walk__note">
      骨架与真实条目同高（38 图标 + 两行文字），加载完不跳版。
    </p>
    <iframe src="../38-messages.html#state-loading" title="消息中心 · 加载态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">消息中心 · 没有消息</h2>
      <span class="walk__tag">empty</span>
    </div>
    <p class="walk__note">
      空态不给按钮。消息不是逛出来的，塞一个「去看看律师」只会显得平台在推销。说清「重要通知不会漏」比塞按钮有用。
    </p>
    <iframe src="../38-messages.html#state-empty" title="消息中心 · 空态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">消息中心 · 加载失败</h2>
      <span class="walk__tag">error</span>
    </div>
    <p class="walk__note">
      说明里必须交代「未读状态不会因为这个丢失」—— 消息页加载失败时，用户最怕的是漏了要紧通知。
    </p>
    <iframe src="../38-messages.html#state-error" title="消息中心 · 错误态"></iframe>
  </section>

</div>

</body>
</html>
