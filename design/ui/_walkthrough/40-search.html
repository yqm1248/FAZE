<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走查 · 搜索的三个非结果态</title>
<style>
/* ==========================================================================
   走查页：第 11 批（40 搜索）的三个非主态
   ==========================================================================
   用途：画布一屏只显示结果态，搜索前 / 无结果 / 搜索中集中在这里看。

   注意：
     1. 不是交付屏，放在 _walkthrough/，不上画布、不计入交付屏
     2. 状态靠 data-state 切换（#state-idle / #state-empty / #state-loading）
     3. 必须用 HTTP 打开（端口 8123），file:// 下 iframe 的 hash 不生效

   核对要点：
     idle    —— 历史可清空、热门带序号；点词直接出结果，不用再敲一遍
     empty   —— 空结果不是死路：说清「换个说法」+ 给推荐词 + 一个找律师的出口
     loading —— 骨架按「分组」形状给，不是一堆等高等宽条
   ========================================================================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px;
  background: #EDEFF3;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #1A1A1A;
}

.walk {
  display: grid;
  grid-template-columns: repeat(2, 390px);
  gap: 24px 28px;
  justify-content: center;
}

.walk__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.walk__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.walk__name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}

.walk__tag {
  font-size: 11px;
  font-weight: 500;
  color: #4A66EE;
  background: #EEF2FF;
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.5;
}

.walk__note {
  font-size: 12px;
  color: #63696E;
  line-height: 1.6;
  max-width: 390px;
}

iframe {
  width: 390px;
  height: 844px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>

<div class="walk">

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">搜索 · 刚进来</h2>
      <span class="walk__tag">idle</span>
    </div>
    <p class="walk__note">
      用户默认看到的就是这一屏。历史可清空，热门带序号；点任一关键词直接出结果，不用再敲一遍。主屏之所以放结果态，是因为结果的分组设计量大得多，这一屏只有两个列表。
    </p>
    <iframe src="../40-search.html#state-idle" title="搜索 · 搜索前"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">搜索 · 没搜到</h2>
      <span class="walk__tag">empty</span>
    </div>
    <p class="walk__note">
      空结果页要回答的是「我是不是搜错了」，不是「什么都没有」。所以标题里带上用户搜的原词，下面给换说法的建议、推荐词，以及一个直接找律师的出口。
    </p>
    <iframe src="../40-search.html#state-empty" title="搜索 · 无结果"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">搜索 · 正在搜</h2>
      <span class="walk__tag">loading</span>
    </div>
    <p class="walk__note">
      骨架按「分组卡」的形状给（一个小标题 + 两行内容），不是一堆等高等宽的灰条 —— 加载完能对上位置，不会跳版。
    </p>
    <iframe src="../40-search.html#state-loading" title="搜索 · 搜索中"></iframe>
  </section>

</div>

</body>
</html>
