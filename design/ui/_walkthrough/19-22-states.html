<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走查 · 案例详情四态 / 送达签收框</title>
<style>
/* ==========================================================================
   走查页：19-case-detail 的四态 + 22-service 的签收确认框
   ==========================================================================
   用途：画布一屏只显示正常态，非正常态与浮层集中在这里看。

   注意：
     1. 不是交付屏，放在 _walkthrough/，不上画布、不计入 68 屏
     2. 19 靠 #state-loading / #state-empty / #state-error 切换
     3. 22 靠 #open-sign 打开签收确认框
     4. 必须用 HTTP 打开（端口 8123）

   核对要点：
     loading —— 标题与正文骨架，高度与真实内容接近，加载完不跳版
     empty   —— 图形 + 说明 + 「返回案例列表」按钮
     error   —— 说明 + 重新加载
     open-sign —— 标题带具体文书名（不是泛泛的「确认签收？」）、
                  hint 说清「签收≠认可」，按钮区有可见分隔
   ========================================================================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px;
  background: #EDEFF3;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #1A1A1A;
}

.walk {
  display: grid;
  grid-template-columns: repeat(2, 390px);
  gap: 24px 28px;
  justify-content: center;
}

.walk__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.walk__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.walk__name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}

.walk__tag {
  font-size: 11px;
  font-weight: 500;
  color: #4A66EE;
  background: #EEF2FF;
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.5;
}

.walk__note {
  font-size: 12px;
  color: #63696E;
  line-height: 1.6;
  max-width: 390px;
}

iframe {
  width: 390px;
  height: 844px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>

<div class="walk">

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">案例详情 · 加载中</h2>
      <span class="walk__tag">loading</span>
    </div>
    <p class="walk__note">
      标题两行 + meta 一行 + 两个分节的正文骨架；骨架总高贴近真实正文，加载完不跳版。
    </p>
    <iframe src="../19-case-detail.html#state-loading" title="案例详情 · 加载态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">案例详情 · 已下架</h2>
      <span class="walk__tag">empty</span>
    </div>
    <p class="walk__note">
      图形 + 说明 + 「返回案例列表」三样齐全，不是死路。
    </p>
    <iframe src="../19-case-detail.html#state-empty" title="案例详情 · 空态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">案例详情 · 加载失败</h2>
      <span class="walk__tag">error</span>
    </div>
    <p class="walk__note">
      说明 + 「重新加载」按钮。底部操作栏保持不动，用户还能退回去。
    </p>
    <iframe src="../19-case-detail.html#state-error" title="案例详情 · 错误态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">送达 · 签收确认</h2>
      <span class="walk__tag">open-sign</span>
    </div>
    <p class="walk__note">
      标题带具体文书名；正文说清期限后果；hint 说清「签收≠认可」，免得用户怕签收
      反而误了期限。签收不可撤销，所以必须过这一问。
    </p>
    <iframe src="../22-service.html#open-sign" title="文书送达 · 签收确认框"></iframe>
  </section>

</div>

</body>
</html>
