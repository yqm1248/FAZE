<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走查 · 文章列表四态</title>
<style>
/* ==========================================================================
   走查页：文章列表的四态并排
   ==========================================================================
   用途：计划 §6.1 要求「每屏必须交付四态」，但一屏一个 HTML 的画布只显示正常态。
         这个文件用 iframe 带 hash 把 12-articles.html 的四种状态并排摆出来走查。

   注意：
     1. 这不是交付屏，放在 _walkthrough/ 子目录，不上画布、不计入 68 屏
     2. app.js 靠 location.hash 的 #state-xxx 切换状态，iframe 里的页面各自读自己的 hash
     3. 用 HTTP 打开（端口 8123）；直接双击 file:// 打开时 iframe 可能被浏览器拦截

   四态核对要点：
     normal  —— 5 张卡片、缩略图 4:3、标题两行截断、下拉刷新与上拉加载入口都在
     loading —— 4 张骨架卡，扫光动画在动，没有文字跳动
     empty   —— 图形 + 「这个分类下还没有文章」+ 「看看全部」按钮，三样齐
     error   —— 断网条（暖色底 + 重试）+ 错误说明 + 「重新加载」按钮
   ========================================================================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px;
  background: #EDEFF3;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #1A1A1A;
}

.walk {
  display: grid;
  grid-template-columns: repeat(2, 390px);
  gap: 24px 28px;
  justify-content: center;
}

.walk__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.walk__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.walk__name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}

.walk__tag {
  font-size: 11px;
  font-weight: 500;
  color: #4A66EE;
  background: #EEF2FF;
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.5;
}

.walk__note {
  font-size: 12px;
  color: #63696E;
  line-height: 1.6;
  max-width: 390px;
}

iframe {
  width: 390px;
  height: 844px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>

<div class="walk">

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">正常态</h2>
      <span class="walk__tag">normal</span>
    </div>
    <p class="walk__note">5 张卡片；缩略图 4:3；标题两行截断保持等高；下拉刷新提示与「上拉加载更多」入口可见。</p>
    <iframe src="../12-articles.html" title="文章列表 · 正常态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">加载中</h2>
      <span class="walk__tag">loading</span>
    </div>
    <p class="walk__note">骨架卡片 4 张，扫光动画在动；结构与正常态一致，加载完不跳版。</p>
    <iframe src="../12-articles.html#state-loading" title="文章列表 · 加载态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">空状态</h2>
      <span class="walk__tag">empty</span>
    </div>
    <p class="walk__note">图形 + 说明 + 下一步按钮三样齐全；按钮回「全部」分类，不是死路。</p>
    <iframe src="../12-articles.html#state-empty" title="文章列表 · 空态"></iframe>
  </section>

  <section class="walk__item">
    <div class="walk__head">
      <h2 class="walk__name">加载失败</h2>
      <span class="walk__tag">error</span>
    </div>
    <p class="walk__note">断网条（暖色底，不吓人）+ 错误说明 + 重新加载按钮；点重试会回到加载态。</p>
    <iframe src="../12-articles.html#state-error" title="文章列表 · 错误态"></iframe>
  </section>

</div>

</body>
</html>
