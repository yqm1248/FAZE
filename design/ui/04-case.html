<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="utf-8">

<meta name="dsh-design" content="app">
<title>案例列表</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ==========================================================================
   案例列表页（Tab 4）—— 复刻原项目 pages/case/case.vue
   版式：白底搜索 + 渐变 banner（每日热点案例）+ 分组列表
   与原图差异（第 1 批已记录）：
     1. 原项目正体用 HTML 语义标签（div/h2/main/section），这里改为 View 对应结构
     2. banner 底色由深红棕改为首页同款浅蓝渐变（原 palette 裁决结果）
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
}

.topbar {
  flex: 0 0 auto;
  background: var(--bg-surface);
  padding: calc(var(--statusbar-h) + 6px) var(--sp-xl) var(--sp-md);
}

.searchbar {
  height: 46px;
  border: 1px solid var(--border-outline);
  border-radius: var(--r-pill);
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: 0 var(--sp-lg);
  color: var(--text-muted);
}

.searchbar svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.searchbar span {
  font-size: var(--fs-lg);
}

.content {
  flex: 1 1 auto;
  overflow-y: auto;
  scrollbar-width: none;
  background: var(--bg-canvas);
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-md));
}
.content::-webkit-scrollbar {
  display: none;
}

/* ---------- 渐变 banner ---------- */
.banner {
  background: linear-gradient(180deg, var(--banner-start) 0%, var(--banner-end) 100%);
  height: 132px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.banner__title {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  letter-spacing: 0.02em;
  line-height: 1.2;
}

.banner__rule {
  width: 68px;
  height: 2px;
  border-radius: 1px;
  background: #7C8CF8;
}

/* ---------- 分组列表 ---------- */
.group {
  padding: var(--sp-xl) var(--sp-xl) 0;
}

.group__title {
  font-size: 18px;
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.3;
}

.group__list {
  margin-top: var(--sp-md);
}

.case-item {
  display: block;
  padding: var(--sp-lg) 0;
  border-block-end: 1px solid var(--border-divider);
  font-size: var(--fs-lg);
  color: var(--text-body);
  line-height: var(--lh-relaxed);
  text-decoration: none;
}

.case-item:active {
  background: var(--bg-surface);
}

.case-item--last {
  border-block-end: 0;
}
</style>
</head>
