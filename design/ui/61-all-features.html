/* ==========================================================================
   功能总览页（第 16 批 · 延展，无参考图）
   ==========================================================================
   职责：把全 App 的功能按用户任务分组铺开，是找不到入口时的兜底导航。
   入口：05-profile 底部 / 首页「全部功能」
   数据来源：静态路由表（与 app.js 的 tabbar / 首页宫格同一份）

   ★ 分组按「用户想干什么」，不按产品模块。产品模块的名字（文书中心、
     案件中心）是开发者的语言，用户脑子里想的是「我要写个起诉状」。
     所以分组是：找律师与咨询 / 办案件 / 订单与钱 / 我的与服务。

   ★ 这一页的存在本身就是承认「主入口设计得不够好」。
     首页三宫格 + 我的页菜单覆盖了高频路径，但总有人找不到东西 ——
     与其让他一层层点进去试，不如给一个全平的清单。
     所以这里的顺序按使用频率排，不按信息架构的漂亮程度排。

   ★ 每格文字控制在 4 字以内。4 列宫格在 390 宽下每格约 85px，
     5 个字会折行或截断，一行 4 列里只要有一格折行，整行基线就歪了。

   ★ 图标沿用各页自己的线性 SVG 形状，不重新画一套。
     用户在首页见过同一个形状，在这里再见到才能对应上。
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
}

.navbar {
  background: var(--bg-surface);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: var(--sp-md) var(--sp-xl) var(--sp-xxl);
}
.screen::-webkit-scrollbar {
  display: none;
}

/* ---------- 分组 ---------- */
.feat-group {
  margin-block-start: var(--sp-lg);
}

.feat-group:first-child {
  margin-block-start: 0;
}

.feat-group__title {
  padding-block-end: var(--sp-sm);
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
}

/* ---------- 宫格 ---------- */
.feat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding-block: var(--sp-sm);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
}

.feat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 12px 2px;
  min-height: 76px;
  text-decoration: none;
  color: inherit;
}

.feat:active .feat__icon {
  background: var(--brand-primary-soft);
}

/* 图标：40 圆的浅底 + 20 的线性图标。底色调成中性，
   避免 17 个彩色圆把这一页搞得像儿童应用 */
.feat__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-input);
  color: var(--text-secondary);
  transition: background-color 120ms ease;
}

.feat__icon svg {
  width: 21px;
  height: 21px;
}

/* 少数几个高频功能给主色，作为视觉锚点，其余保持中性 */
.feat--primary .feat__icon {
  background: var(--brand-primary-soft);
  color: var(--brand-primary-pressed);
}

.feat__label {
  max-width: 100%;
  font-size: var(--fs-micro);
  color: var(--text-body);
  line-height: 1.3;
  text-align: center;
  white-space: nowrap;
}

/* ---------- 页尾 ---------- */
.page-note {
  margin-block-start: var(--sp-lg);
  padding-inline: 2px;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.8;
}

.page-note b {
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
}
</style>
