<style>
/* ==========================================================================
   律师列表页（Tab 2）—— 复刻原项目 pages/lawyer/lawyer.vue
   版式：白底吸顶搜索 + 横滑分类 chips + 律师卡片列表
   与原图差异（第 1 批已记录）：
     1. 律师照片改为占位（将来由律师本人上传），保留 65×80 竖向裁切比例
     2. 图标由位图改为线性 SVG，在线状态保留青绿
     3. 原图横滑分类露出 3.5 个，这里保持同样的截断感（不缩放到能塞下）
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- 顶部白底区（搜索 + 分类） ---------- */
.topbar {
  flex: 0 0 auto;
  background: var(--bg-surface);
  padding-top: calc(var(--statusbar-h) + 6px);
  position: relative;
  z-index: 10;
}

.searchbar {
  margin: 0 var(--sp-xl);
  height: 46px;
  border: 1px solid var(--border-outline);
  border-radius: var(--r-pill);
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: 0 var(--sp-lg);
  color: var(--text-muted);
  background: var(--bg-surface);
}

.searchbar svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.searchbar span {
  font-size: var(--fs-lg);
}

.filter {
  display: flex;
  gap: 10px;
  padding: var(--sp-lg) var(--sp-xl) var(--sp-md);
  overflow-x: auto;
  scrollbar-width: none;
}
.filter::-webkit-scrollbar {
  display: none;
}

.filter__chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 var(--sp-xxl);
  border-radius: var(--r-pill);
  background: var(--bg-input);
  color: var(--text-body);
  font-size: var(--fs-lg);
  text-decoration: none;
  white-space: nowrap;
}

.filter__chip--active {
  background: var(--brand-primary);
  color: var(--text-on-brand);
  font-weight: var(--fw-medium);
}

/* ---------- 列表区 ---------- */
.list {
  flex: 1 1 auto;
  overflow-y: auto;
  scrollbar-width: none;
  background: var(--bg-canvas);
  padding: var(--sp-md) var(--sp-xl) calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-md));
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
}
.list::-webkit-scrollbar {
  display: none;
}

/* ---------- 律师卡片 ---------- */
.lawyer-card {
  display: flex;
  gap: 10px;
  padding: var(--sp-md);
}

.lawyer-card__avatar {
  flex: 0 0 auto;
  width: 65px;
  height: 80px;
  border-radius: var(--r-xs);
  overflow: hidden;
  background: #E8EDFB;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.lawyer-card__avatar svg {
  width: 52px;
  height: 52px;
  color: #9AA9D4;
}

.lawyer-card__body {
  flex: 1 1 auto;
  min-width: 0;
}

.lawyer-card__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-sm);
}

.lawyer-card__name {
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lawyer-card__years {
  flex-shrink: 0;
  font-size: var(--fs-caption);
  color: var(--brand-primary);
}

.lawyer-card__firm {
  margin-top: 4px;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  line-height: var(--lh-normal);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lawyer-card__tags {
  margin-top: var(--sp-sm);
  display: flex;
  gap: var(--sp-xs);
  flex-wrap: wrap;
}

.lawyer-card__foot {
  margin-top: var(--sp-md);
  padding-top: var(--sp-md);
  border-block-start: 1px solid var(--border-divider);
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
}

.status-online {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-xs);
  background: var(--state-success);
  color: var(--text-on-brand);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
}

.rating {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-num);
  font-size: var(--fs-md);
  font-weight: var(--fw-bold);
  color: var(--text-body);
}

.rating svg {
  width: 15px;
  height: 15px;
  color: var(--state-warning);
}

.consulted {
  font-size: var(--fs-caption);
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
}

.lawyer-card__cta {
  margin-inline-start: auto;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin-block: -5px;
  text-decoration: none;
}

.lawyer-card__cta .btn-pill-sm {
  padding: 0 15px;
}
</style>
