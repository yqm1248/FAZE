<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>代写文书</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* ==========================================================================
   律师文书管理（第 17 批 · 延展，无参考图）
   ==========================================================================
   职责：律师代写的文书清单，可新建、继续编辑、发给客户。
   入口：62-workbench 六宫格「代写文书」/ 待办
   数据来源：律师文书接口（委托人 / 文书类型 / 更新时间 / 状态）

   ★ 文书归属客户，列表上必须显示委托人名字。
     律师同时接几个单，只写「民事起诉状」分不出是哪一份 ——
     他得点进去看才知道，点错再退出来，两次操作成本。
     这一点和用户侧的 27-doc-mine 不同：用户侧的文书全是自己的，不用标委托人。

   ★ 「发给客户」是独立状态，不是「已完成」的子集。
     文书写完了但没发，这一单还没交付；页面上要看得出这两者的区别，
     否则律师以为写完了就算完，客户那边什么都没收到。

   ★ 新建入口固定在列表顶部，不放右下角悬浮按钮 ——
     文书是低频创建（一天几份），悬浮按钮会挡住列表里的操作。
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 0 0 var(--sp-xl);
}
.screen::-webkit-scrollbar {
  display: none;
}

/* ---------- 新建入口 ---------- */
.new-doc {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  margin: var(--sp-md) var(--sp-xl) 0;
  padding: var(--sp-md) var(--sp-lg);
  border: 1px dashed var(--border-outline);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  text-decoration: none;
  color: inherit;
}

.new-doc__icon {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-primary-soft);
  color: var(--brand-primary-pressed);
}

.new-doc__icon svg {
  width: 20px;
  height: 20px;
}

.new-doc__body {
  flex: 1 1 0;
  min-width: 0;
}

.new-doc__title {
  display: block;
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.4;
}

.new-doc__desc {
  display: block;
  margin-block-start: 2px;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
}

/* ---------- 文书列表 ---------- */
.doc-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: var(--sp-md) var(--sp-xl) 0;
}

.doc {
  display: block;
  padding: var(--sp-md) var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
  text-decoration: none;
  color: inherit;
}

.doc__head {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-sm);
}

.doc__type {
  flex: 1 1 0;
  min-width: 0;
  font-size: var(--fs-lg);
  font-weight: var(--fw-medium);
  color: var(--text-primary);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.doc__meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-block-start: var(--sp-sm);
  padding-block-start: var(--sp-sm);
  border-block-start: 1px solid var(--border-divider);
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.4;
}

.doc__client {
  flex: 0 0 auto;
  color: var(--text-secondary);
}

.doc__sep {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-muted);
  opacity: 0.6;
}

.doc__time {
  flex: 0 0 auto;
  margin-inline-start: auto;
  font-family: var(--font-num);
}

/* 待发送：在列表上就是一条提醒，不是装饰 */
.doc__send {
  flex: 0 0 auto;
  font-size: var(--fs-caption);
  color: var(--brand-primary-pressed);
  font-weight: var(--fw-medium);
}

/* ---------- 页尾说明 ---------- */
.page-note {
  margin-block-start: var(--sp-lg);
  padding-inline: var(--sp-xl);
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.8;
}

.page-note b {
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
}
</style>
</head>
<body>

<div class="navbar navbar--dark">
  <a class="navbar__back" href="62-workbench.html" aria-label="返回工作台">

    <b>「待发送」表示文书已经写完但客户还没收到。</b>点进去预览确认后发送，发送会同时通知客户并可查看阅读状态。
  </p>

</body>
