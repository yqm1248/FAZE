<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>意见反馈</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* ==========================================================================
   意见反馈页（第 15 批 · 延展，无参考图）
   ==========================================================================
   职责：收集对产品本身的建议与问题（功能建议 / 报错 / 体验），可选留联系方式。
   入口：41-settings「意见反馈」
   数据来源：反馈提交接口

   ★ 这一页和 57 投诉页刻意做成两种语气：
     投诉是「我要讨个说法」—— 有对象、要凭证、给时限、会同步给对方、
     虚假要担责；反馈是「我说个想法」—— 没有对象、截图可选、不必留电话、
     发出去就算完成。
     两页如果长得一样、说得也一样，用户会把该投诉的事写进反馈里，
     然后等不到回音 —— 因为反馈本来就不承诺逐条回复。

   ★ 这一页不出现「投诉」字样，也不给「转投诉」按钮。
     用户走错门是常态，但入口的措辞要能自己拦住人：
     需要投诉的人看到「意见反馈」不会进来，看到「投诉」才会。

   ★ 顶部明确写「不一定会逐条回复」。承诺回复就要有对应的客服产能，
     做不到的承诺比不承诺更伤 —— 用户发了三条都没回音，会认为平台在敷衍。
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
}

.navbar {
  background: var(--bg-surface);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 0 var(--sp-xl) var(--sp-xl);
}
.screen::-webkit-scrollbar {
  display: none;
}

/* ---------- 卡片 ---------- */
.card-block {
  margin-block-start: var(--sp-md);
  padding: var(--sp-md) var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
}

.block-title {
  display: flex;
  align-items: baseline;
  gap: var(--sp-sm);
  padding-block: var(--sp-xs) var(--sp-sm);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
}

.block-title__note {
  font-size: var(--fs-caption);
  font-weight: var(--fw-regular);
  color: var(--text-muted);
}

/* ---------- 顶部说明 ---------- */
.lead {
  padding-block: var(--sp-md) var(--sp-xs);
  font-size: var(--fs-md);
  color: var(--text-secondary);
  line-height: 1.7;
}

.lead b {
  font-weight: var(--fw-medium);
  color: var(--text-primary);
}

/* ---------- 描述框 ---------- */
.bio-wrap {
  position: relative;
  padding-block: var(--sp-xs) 0;
}

.bio-input {
  display: block;
  width: 100%;
  min-height: 132px;
  padding: var(--sp-md);
  border: 0;
  border-radius: var(--r-sm);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit;
  font-size: var(--fs-md);
  line-height: 1.75;
  resize: none;
  outline: none;
}

.bio-input::placeholder {
  color: #A3A9AE;
}

.bio-count {
  position: absolute;
  inset-block-end: var(--sp-sm);
  inset-inline-end: var(--sp-md);
  font-family: var(--font-num);
  font-size: var(--fs-caption);
  color: var(--text-muted);
  pointer-events: none;
}

/* ---------- 字段说明 ---------- */
.field-tip {
  padding: var(--sp-sm) 0 var(--sp-xs);
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.7;
}

.field-tip b {
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
}

/* ---------- 选填的联系方式 ---------- */
.field-line {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  min-height: 52px;
  border-block-end: 1px solid var(--border-divider);
}

.field-line:last-of-type {
  border-block-end: 0;
}

.field-line__label {
  flex: 0 0 76px;
  font-size: var(--fs-md);
  color: var(--text-secondary);
}

.field-line input {
  flex: 1 1 auto;
  min-width: 0;
  height: 52px;
  border: 0;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-num);
  font-size: var(--fs-md);
  outline: none;
}

.field-line input::placeholder {
  color: #A3A9AE;
  font-family: inherit;
}

.optional-tag {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: var(--r-xs);
  background: var(--bg-input);
  color: var(--text-muted);
  font-size: var(--fs-micro);
  line-height: 1.5;
}
</style>
</head>
<body>

<header class="statusbar">
  <span>9:41</span>
  <span class="statusbar__icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
      <rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/>
      <rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/>
      <rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/>
    </svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
      <path d="M1 3.2A10.5 10.5 0 0 1 15 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M3.6 5.9a7 7 0 0 1 8.8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M6.2 8.6a3.4 3.4 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
      <rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="2.2" y="2.2" width="15" height="7.6" rx="1.8" fill="currentColor"/>
      <path d="M23.4 4.2v3.6" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </span>
</header>

<div class="navbar">
  <a class="navbar__back" href="41-settings.html" aria-label="返回设置">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15.2 4.6 7.8 12l7.4 7.4" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <h1 class="navbar__title">意见反馈</h1>
</div>

<main class="screen">

  <p class="lead">
    这里收集对<b>产品本身</b>的建议和问题：哪里用着别扭、哪里报错、想要什么功能。<br>
    每条反馈都会有人看，但<b>不承诺逐条回复</b>；需要处理具体纠纷的，请走<a href="57-complaint.html" style="color: var(--brand-primary-pressed); font-weight: var(--fw-medium); text-decoration: none">投诉</a>或联系在线客服。
  </p>

  <section class="card-block">
    <h2 class="block-title">反馈类型</h2>

    <div class="pick-list" data-choice-group>
      <button class="pick is-active" type="button" data-pick-one="fb-type">功能建议</button>
      <button class="pick" type="button" data-pick-one="fb-type">问题报错</button>
      <button class="pick" type="button" data-pick-one="fb-type">体验问题</button>
      <button class="pick" type="button" data-pick-one="fb-type">其他</button>
    </div>

    <p class="field-tip" style="padding-block-start: var(--sp-sm)">
      <b>问题报错</b>请写清是在哪一屏、点了什么按钮、出现什么结果；有报错弹窗的，把弹窗截图传上来最有用。
    </p>
  </section>

  <section class="card-block">
    <h2 class="block-title">
      具体说说
      <span class="block-title__note">选填，但写了更好办</span>
    </h2>

    <div class="bio-wrap">
      <textarea class="bio-input" maxlength="300" aria-label="反馈内容"
                placeholder="例如：在案件进度页想看每一次法院通知的原文，现在只能看到一句摘要，得再去消息里翻。希望能直接点开。"
                data-field="feedback">在案件进度页想看每一次法院通知的原文，现在只显示一句摘要，还得切到消息中心翻。希望能直接点开看全文。</textarea>
      <span class="bio-count">50 / 300</span>
    </div>

    <div class="upload-list">
      <button class="upload" type="button" data-upload>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.2" y="5.4" width="17.6" height="13.2" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="8.8" cy="10.2" r="1.6" stroke="currentColor" stroke-width="1.6"/>
          <path d="m4 16.6 4.4-4 3.1 2.8 3-2.6 4.5 4" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="upload__text">
          上传截图
          <span class="upload__hint" data-upload-hint
                data-idle="选填，最多 3 张"
                data-done="已上传，点击可重新选择">选填，最多 3 张</span>
        </span>
      </button>
    </div>
  </section>

  <section class="card-block">
    <h2 class="block-title">
      联系方式
      <span class="block-title__note">选填</span>
    </h2>

    <div class="field-line">
      <span class="field-line__label">手机号</span>
      <input type="tel" inputmode="tel" maxlength="11" placeholder="想收到回复就填一下"
             aria-label="联系方式" data-field="contact">
      <span class="optional-tag">可不填</span>
    </div>

    <p class="field-tip">
      留了手机号的，遇到需要进一步确认的问题客服会打电话；<b>不填也能提交</b>，只是有时我们想问清楚却联系不上。
    </p>
  </section>

</main>

<div class="actionbar">
  <button class="btn-primary actionbar__cta" type="button" data-submit-feedback>提交反馈</button>
</div>

<script src="app.js"></script>
</body>
</html>
