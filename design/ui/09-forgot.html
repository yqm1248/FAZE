<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>忘记密码</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ==========================================================================
   忘记密码页 —— 原项目无参考图，按「分步表单」母版延展
   依据：《页面导航树》模块 0「三步流程，单页分步」
         Step 1 手机号 + 验证码 → Step 2 设置新密码 → Step 3 重置成功
   当前展示 Step 1 状态
   ========================================================================== */

body {
  background: var(--bg-surface);
  display: flex;
  flex-direction: column;
}

/* ---------- 导航栏 ---------- */
.navbar {
  flex: 0 0 auto;
  padding: calc(var(--statusbar-h) + 4px) var(--sp-xl) var(--sp-md);
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}

.navbar__back {
  width: 44px;
  height: 44px;
  margin-inline-start: -12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  background: none;
  color: var(--text-primary);
  text-decoration: none;
  padding: 0;
  border-radius: var(--r-sm);
  flex-shrink: 0;
}

.navbar__back svg {
  width: 22px;
  height: 22px;
}

.navbar__title {
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.25;
}

/* ---------- 步骤条 ---------- */
.steps {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  padding: var(--sp-md) var(--sp-xl) var(--sp-lg);
}

.step {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
}

/* 圆点之间的连线 */
.step + .step::before {
  content: "";
  position: absolute;
  inset-block-start: 11px;
  inset-inline-end: 50%;
  width: 100%;
  height: 1px;
  background: var(--border-outline);
  z-index: 0;
}

.step--done + .step::before,
.step--active + .step::before {
  background: var(--border-outline);
}

.step__dot {
  width: 23px;
  height: 23px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-num);
  font-size: var(--fs-caption);
  font-weight: var(--fw-bold);
  background: var(--bg-input);
  color: var(--text-muted);
  position: relative;
  z-index: 1;
}

.step--active .step__dot {
  background: var(--brand-primary);
  color: var(--text-on-brand);
}

.step--done .step__dot {
  background: var(--brand-primary-soft);
  color: var(--brand-primary);
}

.step__dot svg {
  width: 13px;
  height: 13px;
}

.step__label {
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.2;
  white-space: nowrap;
}

.step--active .step__label,
.step--done .step__label {
  color: var(--text-body);
}

/* ---------- 表单区 ---------- */
.forgot-body {
  flex: 1 1 auto;
  overflow-y: auto;
  min-height: 0;
  padding: var(--sp-xl) var(--sp-xl) 0;
}

.forgot__title {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.forgot__desc {
  margin-block-start: var(--sp-md);
  font-size: var(--fs-md);
  color: var(--text-secondary);
  line-height: var(--lh-relaxed);
}

.fields {
  margin-block-start: var(--sp-xxxl);
}

.field {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  height: 58px;
  border-block-end: 1px solid var(--border-outline);
}

.field svg {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  color: var(--text-secondary);
}

.field input {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: none;
  font-family: inherit;
  font-size: var(--fs-h3);
  color: var(--text-primary);
}

.field input::placeholder {
  color: var(--text-muted);
}

.code-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 0 0 var(--sp-md);
  border: 0;
  border-inline-start: 1px solid var(--border-outline);
  background: none;
  color: var(--brand-primary);
  font-family: inherit;
  font-size: var(--fs-md);
  cursor: pointer;
}

/* ---------- 底部按钮 ---------- */
.forgot-foot {
  flex: 0 0 auto;
  padding: var(--sp-xl) var(--sp-xl) calc(var(--safe-bottom) + var(--sp-lg));
}

.next-btn {
  height: var(--btn-h);
  width: 100%;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, var(--login-btn-start) 0%, var(--login-btn-end) 100%);
  color: var(--text-on-brand);
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  box-shadow: var(--shadow-pill);
  min-height: 44px;
}

.next-btn:active {
  filter: brightness(0.95);
}

.forgot__tip {
  margin-block-start: var(--sp-lg);
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--text-muted);
  line-height: var(--lh-relaxed);
}

.forgot__tip a {
  color: var(--brand-primary);
  text-decoration: none;
  font-weight: var(--fw-medium);
}
</style>
</head>
<body>

<header class="statusbar">
  <span>9:41</span>
  <span class="statusbar__icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
      <rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/>
      <rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/>
      <rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/>
    </svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
      <path d="M1 3.2A10.5 10.5 0 0 1 15 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M3.6 5.9a7 7 0 0 1 8.8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M6.2 8.6a3.4 3.4 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
      <rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="2.2" y="2.2" width="15" height="7.6" rx="1.8" fill="currentColor"/>
      <path d="M23.4 4.2v3.6" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </span>
</header>

<div class="navbar">
  <a class="navbar__back" href="06-login.html" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="m14.5 5.5-6.5 6.5 6.5 6.5" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <h1 class="navbar__title">忘记密码</h1>
</div>

<div class="steps">
  <div class="step step--active">
    <i class="step__dot">1</i>
    <span class="step__label">验证手机</span>
  </div>
  <div class="step">
    <i class="step__dot">2</i>
    <span class="step__label">设置密码</span>
  </div>
  <div class="step">
    <i class="step__dot">3</i>
    <span class="step__label">完成</span>
  </div>
</div>

<div class="forgot-body">
  <h2 class="forgot__title">验证手机号</h2>
  <p class="forgot__desc">请输入注册时使用的手机号，我们会向该号码发送验证码。</p>

  <form class="fields" onsubmit="return false;">
    <label class="field">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6.4" y="2.6" width="11.2" height="18.8" rx="2.6" stroke="currentColor" stroke-width="1.9"/>
        <path d="M10.6 5.6h2.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <input type="tel" inputmode="numeric" placeholder="请输入手机号" autocomplete="tel">
    </label>

    <label class="field">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.9 4.4 5.8v6.1c0 4.4 3.1 8.2 7.6 9.2 4.5-1 7.6-4.8 7.6-9.2V5.8L12 2.9Z"
              stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      </svg>
      <input type="tel" inputmode="numeric" placeholder="请输入验证码" autocomplete="one-time-code">
      <button class="code-btn" type="button">获取验证码</button>
    </label>
  </form>
</div>

<div class="forgot-foot">
  <a class="next-btn" href="09-forgot.html">下一步</a>
  <p class="forgot__tip">想起密码了？<a href="06-login.html">返回登录</a></p>
</div>

<script src="app.js"></script>
</body>
</html>
