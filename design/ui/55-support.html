<style>
/* ==========================================================================
   客服中心页（第 15 批 · 延展，无参考图）
   ==========================================================================
   职责：自助入口（常见问题）优先，其次人工客服，再次电话；附热门问题直达。
   入口：05-profile「客服中心」/ 16-join-status / 30-order-detail / 32-pay-result / 38-messages
   数据来源：客服热线配置（静态）+ 热门问题列表（按点击量排序）

   ★ 顺序是这一页最重要的设计决定：常见问题在最上、占最大面积。
     人工客服是成本最高的通道，把它放在第一位的产品会得到「咨询量很高、
     满意度很低」的结果 —— 因为一半的问题在 FAQ 里就有答案，
     而人工客服一次只能服务一个人，排队一长用户就开始骂。
     把自助放前面不是省成本，是让用户在 30 秒内拿到答案，而不是排 20 分钟队。

   ★ 热线号码做成可点拨号（tel:），不是「仅展示」。
     导航树原文写「客服热线（仅展示号码）」，但目标用户里有大量中老年人，
     他们会盯着号码去拨号盘一位一位敲，敲错一位就打到别人家里去了。
     点了直接进拨号界面，号码已经填好，这一步平台能做到，没有理由不做。

   ★ 必须写清人工客服的服务时间。不写的话，晚上十点进来的用户会等，
     等不到就认为「客服不理人」—— 同样的事实在页面上写明，观感完全不同。
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
}

.navbar {
  background: var(--bg-surface);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: var(--sp-md) var(--sp-xl) var(--sp-xxl);
}
.screen::-webkit-scrollbar {
  display: none;
}

/* ---------- 顶部引导 ---------- */
.lead {
  padding-block: var(--sp-xs) var(--sp-md);
  font-size: var(--fs-md);
  color: var(--text-secondary);
  line-height: 1.6;
}

/* ---------- 三个入口 ---------- */
.entry-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.entry {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  width: 100%;
  padding: var(--sp-md) var(--sp-lg);
  border: 0;
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
  font-family: inherit;
  text-align: start;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.entry__icon {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

.entry__icon svg {
  width: 22px;
  height: 22px;
}

/* 三种入口用三个色：主色 / 青 / 橙，与原项目三宫格的配色逻辑一致 */
.entry__icon--faq {
  background: var(--brand-primary-soft);
  color: var(--brand-primary-pressed);
}

.entry__icon--chat {
  background: var(--state-success-soft);
  color: var(--state-success);
}

.entry__icon--phone {
  background: var(--state-warning-soft);
  color: var(--state-warning-deep);
}

.entry__body {
  flex: 1 1 auto;
  min-width: 0;
}

.entry__title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.4;
}

.entry__desc {
  display: block;
  margin-block-start: 3px;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
}

/* 在线状态点：只在人工客服那一张出现 */
.entry__live {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-micro);
  font-weight: var(--fw-regular);
  color: var(--state-success);
}

.entry__live::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.entry__chevron {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
}

/* 热线卡片里的号码：等宽大字，一眼看完 */
.entry__phone {
  display: block;
  margin-block-start: 2px;
  font-family: var(--font-num);
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  letter-spacing: 0.5px;
  line-height: 1.3;
}

/* ---------- 热门问题 ---------- */
.section-title {
  padding-block: var(--sp-xl) var(--sp-sm);
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
}

.hot-list {
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.hot {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  width: 100%;
  min-height: 52px;
  padding: 13px var(--sp-lg);
  border: 0;
  border-block-end: 1px solid var(--border-divider);
  background: transparent;
  font-family: inherit;
  text-align: start;
  text-decoration: none;
  color: var(--text-body);
  cursor: pointer;
}

.hot:last-child {
  border-block-end: 0;
}

.hot:active {
  background: var(--bg-canvas);
}

.hot__text {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-md);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hot__chevron {
  flex: 0 0 auto;
  width: 15px;
  height: 15px;
  color: var(--text-muted);
}

/* ---------- 页尾说明 ---------- */
.page-note {
  margin-block-start: var(--sp-lg);
  padding-inline: 2px;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.8;
}

.page-note b {
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
}
</style>
</head>
