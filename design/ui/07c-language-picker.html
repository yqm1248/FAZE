<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>语言选择</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* ==========================================================================
   首启语言选择浮层 —— 原项目无参考图，按导航树延展
   依据：《页面导航树》模块 0「首次进入 → 🪟 语言选择浮层（默认简体中文）」
   这是启动页的一种状态：底部弹层，背景仍是品牌页
   注意：这一屏是 4 语言的入口，列表里同时出现 LTR 与 RTL 文字
   ========================================================================== */

body {
  width: var(--screen-w);
  height: var(--screen-h);
  overflow: hidden;
  background: linear-gradient(180deg, #5266EC 0%, #4053D0 100%);
  color: var(--text-on-brand);
  display: flex;
  flex-direction: column;
}

.splash-bg {
  /* ★ 品牌区只吃「弹层之上」的剩余空间：flex-basis 设 0 而不是 auto，
     基础尺寸不参与分配，弹层占多少它就让多少。
     原来这里用 padding-block-end: 150px 把内容从整屏中心往上顶，
     那是在「弹层绝对定位、不占流」的前提下凑出来的位置 ——
     一旦弹层高度变化（语言从 2 个加到 4 个），内容重心就落进弹层覆盖区，
     品牌语被切掉半行。现在改成由 flex 真正分配高度，不再靠魔数回避。 */
  flex: 1 1 0;
  /* flex item 默认 min-height: auto，内容会把它撑到"装得下"为止 */
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.logo {
  width: 88px;
  height: 88px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo svg {
  width: 52px;
  height: 52px;
}

.splash-name {
  margin-block-start: 26px;
  font-size: 30px;
  font-weight: var(--fw-bold);
  letter-spacing: 0.14em;
  text-indent: 0.14em;
  line-height: 1.2;
}

.splash-slogan {
  margin-block-start: 12px;
  font-size: var(--fs-md);
  letter-spacing: 0.04em;
  line-height: var(--lh-normal);
}

.mask {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 40;
}

/* ---------- 底部弹层 ---------- */
/* ★ 弹层参与 body 的纵向 flex，不再用 absolute 贴底。
   绝对定位的弹层不占流，父容器按「内容」算高度，两者各自为政：
   弹层贴的是容器底边，不是屏幕底边，容器一被撑高，弹层就跟着掉出屏幕。
   进流之后 body 高度 844 被「品牌区 + 弹层」精确瓜分，没有溢出空间。
   .mask 仍是 absolute（遮罩本来就该盖满全屏、不参与分配），
   弹层靠 position: relative + 更高的 z-index 压在遮罩之上。 */
.sheet {
  position: relative;
  z-index: 50;
  flex: 0 0 auto;
  background: var(--bg-surface);
  border-start-start-radius: 20px;
  border-start-end-radius: 20px;
  padding: 10px var(--sp-xl) calc(var(--safe-bottom) + var(--sp-lg));
  color: var(--text-body);
}

.sheet__handle {
  width: 38px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--border-outline);
  margin: 0 auto;
}

.sheet__title {
  margin-block-start: 18px;
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.3;
  text-align: center;
}

.sheet__sub {
  margin-block-start: 6px;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: var(--lh-normal);
  text-align: center;
}

/* ---------- 语言列表 ---------- */
/* .lang-list / .lang 已提到 components.css 第 31 段（第 16 批：07c / 60 两处用） */

/* ---------- 确定 ---------- */
.sheet__confirm {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-block-start: var(--sp-lg);
  height: 48px;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, var(--login-btn-start) 0%, var(--login-btn-end) 100%);
  color: var(--text-on-brand);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  text-decoration: none;
  box-shadow: var(--shadow-pill);
  min-height: 44px;
}
</style>
</head>
<body>

<header class="statusbar statusbar--light">
  <span>9:41</span>
  <span class="statusbar__icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
      <rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/>
      <rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/>
      <rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/>
    </svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
      <path d="M1 3.2A10.5 10.5 0 0 1 15 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M3.6 5.9a7 7 0 0 1 8.8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M6.2 8.6a3.4 3.4 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
      <rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="2.2" y="2.2" width="15" height="7.6" rx="1.8" fill="currentColor"/>
      <path d="M23.4 4.2v3.6" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </span>
</header>

<div class="splash-bg">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M32 11v33" stroke="#F5B942" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M22 48h20" stroke="#F5B942" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M15 19h34" stroke="#F5B942" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M15 19 7.6 30.4a7.6 7.6 0 0 0 14.8 0L15 19Z" fill="#F5B942"/>
      <path d="M49 19l-7.4 11.4a7.6 7.6 0 0 0 14.8 0L49 19Z" fill="#F5B942"/>
      <circle cx="32" cy="11" r="3.2" fill="#F5B942"/>
    </svg>
  </div>
  <h1 class="splash-name">法泽</h1>
  <p class="splash-slogan">法护民生 · 智慧法律服务</p>
</div>

<i class="mask"></i>

<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <i class="sheet__handle" aria-hidden="true"></i>
  <h2 class="sheet__title" id="sheet-title">选择语言</h2>
  <p class="sheet__sub">可随时在「我的 — 设置 — 语言」中修改</p>

  <div class="lang-list" data-lang-list>
    <button class="lang is-active" type="button" data-lang="zh-Hans">
      <span class="lang__native">简体中文</span>
      <span class="lang__cn">中文</span>
      <svg class="lang__check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 12.6 4.6 4.6L19 6.8" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="lang" type="button" data-lang="bo">
      <span class="lang__native" dir="ltr">བོད་ཡིག</span>
      <span class="lang__cn">藏文</span>
      <svg class="lang__check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 12.6 4.6 4.6L19 6.8" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="lang" type="button" data-lang="ug-Arab-CN">
      <span class="lang__native" dir="rtl">ئۇيغۇرچە</span>
      <span class="lang__cn">维吾尔文</span>
      <svg class="lang__check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 12.6 4.6 4.6L19 6.8" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="lang" type="button" data-lang="kk-Arab-CN">
      <span class="lang__native" dir="rtl">قازاقشا</span>
      <span class="lang__cn">哈萨克文</span>
      <svg class="lang__check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 12.6 4.6 4.6L19 6.8" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <a class="sheet__confirm" href="01-home.html">确定</a>
</div>

<script src="app.js"></script>
</body>
</html>
