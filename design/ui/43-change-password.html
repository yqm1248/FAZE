<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>修改登录密码</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* ==========================================================================
   修改登录密码页（第 12 批 · 延展，无参考图）
   ==========================================================================
   职责：验证旧密码，设置新密码。
   入口：42-account-security「修改登录密码」
   母版：**表单页母版**（同 15-lawyer-join / 33-refund：
         分组卡 + 字段 + 强度提示 + 底部提交栏）
   数据来源：改密接口（旧密码校验 + 新密码）

   ★ 三个输入各自用一句说明交代「为什么」：
     旧密码是为了确认是你本人；新密码规则写在下面而不是等提交失败才提示；
     确认框是防手抖 —— 密码框看不到内容，打错的概率比可见字段高得多。

   ★ 新密码不做「必须含大小写数字符号」那套强制规则。
     本产品用户里有不少中老年人，复杂的强制规则让他们把密码写在纸上贴在手机背面，
     最后更不安全。这里只要求 8~16 位、不能与旧密码相同、不能是纯重复字符。
     安全性靠短信验证码登录这一类旁路来兜底，不靠密码复杂度堆。

   ★ 改完密码不强制重新登录：用户刚证明过自己是本人（旧密码 + 登录态），
     再踢一次只会让他怀疑「是不是改失败了」。
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
}

.navbar {
  background: var(--bg-surface);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 0 var(--sp-xl) var(--sp-xl);
}
.screen::-webkit-scrollbar {
  display: none;
}

.card-block {
  margin-block-start: var(--sp-md);
  padding: var(--sp-xs) var(--sp-lg) var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
}

/* ---------- 字段 ---------- */
.form-field {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  min-height: 52px;
  border-block-end: 1px solid var(--border-divider);
}

.form-field:last-of-type {
  border-block-end: 0;
}

.form-field__label {
  flex: 0 0 76px;
  font-size: var(--fs-md);
  color: var(--text-secondary);
}

.form-field input {
  flex: 1 1 auto;
  min-width: 0;
  height: 52px;
  border: 0;
  background: transparent;
  color: var(--text-primary);
  font-family: inherit;
  font-size: var(--fs-lg);
  outline: none;
}

.form-field input::placeholder {
  color: #A3A9AE;
}

/* 显示 / 隐藏密码：热区 44，视觉是小图标 */
.pw-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.pw-toggle svg {
  width: 20px;
  height: 20px;
}

.pw-toggle.is-on {
  color: var(--brand-primary);
}

/* ---------- 强度提示 ---------- */
.strength {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding-block: var(--sp-md) 0;
}

.strength__bars {
  display: flex;
  flex: 1 1 auto;
  gap: 4px;
}

.strength__bar {
  flex: 1 1 0;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--border-outline);
}

.strength__bar.is-on {
  background: var(--state-warning);
}

.strength__bar.is-on.is-strong {
  background: var(--state-success);
}

.strength__text {
  flex: 0 0 auto;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.4;
}

/* ---------- 规则说明 ---------- */
.rule-note {
  padding: var(--sp-md) var(--sp-xs) 0;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.8;
}

.rule-note b {
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
}
</style>
</head>
<body>

<header class="statusbar">
  <span>9:41</span>
  <span class="statusbar__icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
      <rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/>
      <rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/>
      <rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/>
    </svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
      <path d="M1 3.2A10.5 10.5 0 0 1 15 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M3.6 5.9a7 7 0 0 1 8.8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M6.2 8.6a3.4 3.4 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
      <rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="2.2" y="2.2" width="15" height="7.6" rx="1.8" fill="currentColor"/>
      <path d="M23.4 4.2v3.6" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </span>
</header>

<div class="navbar">
  <a class="navbar__back" href="42-account-security.html" aria-label="返回账号与安全">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15.2 4.6 7.8 12l7.4 7.4" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <h1 class="navbar__title">修改登录密码</h1>
</div>

<main class="screen">

  <section class="card-block">
    <div class="form-field">
      <span class="form-field__label">旧密码</span>
      <input type="password" autocomplete="current-password" placeholder="输入现在的登录密码"
             aria-label="旧密码" data-pw="old">
      <button class="pw-toggle" type="button" data-eye="old" aria-label="显示旧密码">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M2.4 12S5.8 5.6 12 5.6 21.6 12 21.6 12 18.2 18.4 12 18.4 2.4 12 2.4 12Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </div>
    <div class="form-field">
      <span class="form-field__label">新密码</span>
      <input type="password" autocomplete="new-password" placeholder="8 到 16 位，区分大小写"
             aria-label="新密码" data-pw="new" data-pw-strength>
      <button class="pw-toggle" type="button" data-eye="new" aria-label="显示新密码">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M2.4 12S5.8 5.6 12 5.6 21.6 12 21.6 12 18.2 18.4 12 18.4 2.4 12 2.4 12Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </div>
    <div class="form-field">
      <span class="form-field__label">确认新密码</span>
      <input type="password" autocomplete="new-password" placeholder="再输一次"
             aria-label="确认新密码" data-pw="confirm">
      <button class="pw-toggle" type="button" data-eye="confirm" aria-label="显示确认密码">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M2.4 12S5.8 5.6 12 5.6 21.6 12 21.6 12 18.2 18.4 12 18.4 2.4 12 2.4 12Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </div>

    <div class="strength">
      <div class="strength__bars">
        <span class="strength__bar is-on"></span>
        <span class="strength__bar is-on"></span>
        <span class="strength__bar"></span>
      </div>
      <span class="strength__text" data-pw-text>中等</span>
    </div>
  </section>

  <p class="rule-note">
    <b>密码要求：</b>8 到 16 位，区分大小写，不能和旧密码相同。<br>
    不建议用生日、手机号、姓名拼音这类别人容易猜到的组合。修改后建议记在只有你能看到的地方，不要写在纸上贴在手机背面。
  </p>

</main>

<div class="actionbar">
  <button class="btn-primary actionbar__cta" type="button" data-save-password>保存新密码</button>
</div>

<script src="app.js"></script>
</body>
</html>
