/* ==========================================================================
   AI 对话页（Tab 3）—— 复刻原项目 pages/ai-agent/ai-agent.vue
   版式：白底顶栏 + 空白引导态 + 底部输入条
   与原图差异（第 1 批已记录）：
     1. 顶栏两个图标由位图改为线性 SVG（电话 / 扫描）
     2. 原图正文区是纯空白，这里保留完全一致的空白引导态
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
}

.appbar {
  flex: 0 0 auto;
  background: var(--bg-surface);
  padding: calc(var(--statusbar-h) + 4px) var(--sp-xl) var(--sp-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-block-end: 1px solid var(--border-divider);
}

.appbar__title {
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.25;
}

.appbar__actions {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
}

.icon-btn {
  width: 44px;
  height: 44px;
  margin-inline-end: -10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  background: none;
  color: var(--text-primary);
  cursor: pointer;
  padding: 0;
  border-radius: var(--r-sm);
}

.icon-btn:last-child {
  margin-inline-end: 0;
}

.icon-btn svg {
  width: 22px;
  height: 22px;
}

.chat-body {
  flex: 1 1 auto;
  overflow-y: auto;
  scrollbar-width: none;
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--sp-xxxl) var(--sp-xxl) var(--sp-lg);
}
.chat-body::-webkit-scrollbar {
  display: none;
}

.chat-hint {
  margin-top: 34px;
  font-size: var(--fs-lg);
  color: var(--text-muted);
  text-align: center;
  line-height: var(--lh-normal);
  max-width: 20em;
}

/* ---------- 底部输入条 ---------- */
.composer {
  flex: 0 0 auto;
  background: var(--bg-surface);
  padding: var(--sp-md) var(--sp-xl);
  border-block-start: 1px solid var(--border-divider);
}

.composer__box {
  height: 46px;
  border-radius: var(--r-sm);
  background: var(--bg-canvas);
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  padding: 0 var(--sp-md);
}

.composer__box svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: var(--text-body);
}

.composer__placeholder {
  flex: 1 1 auto;
  font-size: var(--fs-lg);
  color: var(--text-muted);
}
</style>
</head>

<!-- ========================================================================
     浮层：清空当前对话二次确认（第 5 批交付的页内浮层）
     ==========================================================================
     计划 §3.2 把这条排在「AI 对话 · 清空当前对话（二次确认）」。
     用 components.css 的 .mask / .dialog，和「退出登录」同一个组件。

     文案上做了一件事：告诉用户「其实不用清空」。
     清空是不可撤销的，但用户点这个按钮往往只是嫌上下文乱了 ——
     真正该做的是一次「新对话」，不是销毁。所以 hint 里给了替代路径。
     ======================================================================== -->
<div class="mask" data-clear-mask hidden></div>

<div class="dialog" data-clear-dialog hidden role="alertdialog" aria-modal="true"
     aria-labelledby="clear-title" aria-describedby="clear-desc">
  <h2 class="dialog__title" id="clear-title">清空当前对话？</h2>
  <p class="dialog__body" id="clear-desc">
    这一轮对话的内容会被清空，也不会保留在「对话历史」里。
  </p>
  <p class="dialog__hint">
    如需更换问题，可直接继续提问，不必清空 —— 保留上下文时回答更准确。
  </p>
  <div class="dialog__actions">
    <button class="dialog__btn" type="button" data-clear-close>取消</button>
    <button class="dialog__btn dialog__btn--danger" type="button" data-clear-confirm>清空</button>
  </div>
</div>

<script src="app.js"></script>
</body>
