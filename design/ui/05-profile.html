<style>
/* ==========================================================================
   我的页（Tab 5）—— 复刻原项目 pages/my/my.vue
   版式：品牌渐变头（标语 + 天秤）+ 负边距用户卡 + 三栏快捷 + 菜单列表 + 退出
   与原图差异（第 1 批已记录）：
     1. 原项目这一页用了一整套 emoji 当图标（蓝盾/蓝心/紫人/泡泡/红问号/紫叹号/
        紫齿轮），全部换成同一套线性 SVG，颜色仍按原项目的蓝/紫/红三系
     2. 头像改为占位（将来用户自己上传）
     3. 天秤由半透明 emoji 改为半透明白色线性 SVG，位置与大小保持
   ========================================================================== */

.hero {
  background: linear-gradient(180deg, var(--profile-start) 0%, var(--profile-end) 100%);
  /* 高度必须容得下：状态栏 54 + 上边距 18 + 标语两行约 65 + 与用户卡的间距 15 + 卡片上压 44 */
  height: 196px;
  padding: calc(var(--statusbar-h) + 18px) var(--sp-xl) 0;
  position: relative;
  overflow: hidden;
}

/* 状态栏在渐变上，给它同色背景，避免可读性判定取到页面底色 */
.statusbar--light {
  background: var(--profile-start);
}

.hero__slogan {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  color: var(--text-on-brand);
  line-height: 1.35;
  letter-spacing: 0.04em;
}

.hero__scale {
  position: absolute;
  inset-block-start: calc(var(--statusbar-h) + 6px);
  inset-inline-end: 18px;
  width: 88px;
  height: 88px;
  color: rgba(255, 255, 255, 0.34);
}

.content {
  padding: 0 var(--sp-xl);
  margin-top: -44px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
}

/* ---------- 我的钱包（v1.6 新增，余额制的入口） ----------
   为什么放用户卡正下方第一块，而不是塞进「我的服务」宫格：
   余额是用户在这个产品里最实在的资产，宫格里的四项都是「去做一件事」，
   余额是「我有什么」，性质不同，混在一起就不显眼了。
   底色沿用顶部 hero 的品牌渐变，不引入第四种底色。 */
.wallet {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  padding: var(--sp-md) var(--sp-lg);
  border-radius: var(--r-md);
  background: linear-gradient(to bottom right, var(--profile-start), var(--profile-end));
  color: var(--text-on-brand);
  box-shadow: var(--shadow-raised);
}

.wallet__main {
  flex: 1 1 auto;
  min-width: 0;
  display: block;
  text-decoration: none;
  color: inherit;
}

.wallet__label {
  display: block;
  font-size: var(--fs-caption);
  opacity: 0.84;
  line-height: 1.4;
}

.wallet__amount {
  display: block;
  margin-block-start: 2px;
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: 1.2;
  color: var(--text-on-brand);
}

.wallet__amount .money__sym {
  color: var(--text-on-brand);
}

.wallet__hint {
  display: block;
  margin-block-start: 2px;
  font-size: var(--fs-micro);
  opacity: 0.78;
  line-height: 1.4;
}

/* 深底上的按钮：白底蓝字。视觉 36 高，热区靠 ::after 补到 44 */
.wallet__btn {
  position: relative;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 76px;
  height: 36px;
  padding-inline: var(--sp-md);
  border-radius: var(--r-pill);
  background: var(--bg-surface);
  color: var(--brand-primary-pressed);
  font-size: var(--fs-md);
  font-weight: var(--fw-medium);
  text-decoration: none;
}

.wallet__btn::after {
  content: "";
  position: absolute;
  inset-block: -4px;
  inset-inline: 0;
}

/* ---------- 用户卡 ---------- */
.user-card {
  display: flex;
  align-items: center;
  gap: var(--sp-lg);
  padding: var(--sp-xl) var(--sp-lg);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-raised);
}

.avatar {
  flex: 0 0 auto;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--bg-canvas);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.avatar svg {
  width: 46px;
  height: 46px;
  color: #C7CCD6;
}

.user-card__name {
  font-size: 20px;
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.3;
}

.user-card__phone {
  margin-top: 4px;
  font-family: var(--font-num);
  font-size: var(--fs-lg);
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

/* 身份标签 */
.user-card__row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.user-card__badge {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 6px;
  border-radius: var(--r-xs);
  background: var(--brand-primary-soft);
  color: var(--brand-primary-pressed);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  line-height: 1;
  flex-shrink: 0;
}

/* ---------- 未认证提示条 ---------- */
.notice {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: 14px var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--state-warning-soft);
  text-decoration: none;
  box-shadow: var(--shadow-card);
  min-height: 44px;
}

.notice__text {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-caption);
  color: var(--state-warning-deep);
  line-height: 1.4;
}

.notice__arrow {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--state-warning-deep);
}

/* ---------- 我的服务 ---------- */
.services {
  padding: var(--sp-lg) var(--sp-lg) 13px;
}

.services__title {
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: 1.3;
}

.services__grid {
  margin-top: var(--sp-md);
  display: flex;
}

.services__item {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px 2px;
  text-decoration: none;
  color: var(--text-body);
  border-radius: var(--r-sm);
}

.services__item:active {
  background: var(--bg-canvas);
}

.services__item svg {
  width: 24px;
  height: 24px;
  color: var(--brand-primary);
}

.services__label {
  font-size: var(--fs-caption);
  line-height: 1.2;
  white-space: nowrap;
}

/* ---------- 三栏快捷 ---------- */
.quick-links {
  display: flex;
  padding: var(--sp-lg) 0;
}

.quick-links__item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-sm);
  text-decoration: none;
  color: var(--text-body);
  position: relative;
}

.quick-links__item + .quick-links__item::before {
  content: "";
  position: absolute;
  inset-block: 4px;
  inset-inline-start: 0;
  width: 1px;
  background: var(--border-divider);
}

.quick-links__item svg {
  width: 30px;
  height: 30px;
}

.quick-links__label {
  font-size: var(--fs-caption);
  color: var(--text-body);
}

/* ---------- 菜单 ---------- */
.menu {
  overflow: hidden;
}

.menu__row {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  padding: 15px var(--sp-lg);
  text-decoration: none;
  color: var(--text-body);
  border-block-end: 1px solid var(--border-divider);
  min-height: 52px;
}

.menu__row:last-child {
  border-block-end: 0;
}

.menu__row:active {
  background: var(--bg-canvas);
}

.menu__row svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.menu__label {
  flex: 1 1 auto;
  font-size: var(--fs-lg);
}

.menu__chevron {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ---------- 退出 ---------- */
.logout {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: var(--btn-h);
  border: 0;
  background: var(--bg-surface);
  border-radius: var(--r-sm);
  color: var(--state-danger);
  font-family: inherit;
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  text-decoration: none;
  box-shadow: var(--shadow-card);
  cursor: pointer;
}

.logout:active {
  background: var(--bg-canvas);
}
</style>
</head>
