<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="dsh-design" content="app">
<title>客户咨询</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* ==========================================================================
   律师客户咨询列表（第 17 批 · 延展，无参考图）
   ==========================================================================
   职责：律师侧的会话列表，按「要不要我回」排序。
   入口：62-workbench 六宫格「我的客户」/ 待办 / 最近咨询「查看全部」
   数据来源：律师会话列表接口（用户昵称 / 最后消息 / 未读数 / 最近时间 / 订单状态）

   ★ 与用户侧的 38-messages 是两套东西，别混：
     用户侧按「系统通知 / 律师回复 / 客服」分类，律师侧只有一类 —— 客户。
     律师关心的是「谁在等我回」和「这单付没付钱」，不是消息类型。

   ★ 排序按「未读优先，其次最近」而不是纯按时间。
     律师一天开十次这个页面，每次只想看到「该我回的」。
     纯按时间排，一条已读的旧会话会把三条未读压到下面去。

   ★ 会话条目上带订单状态（已付款 / 未付款）。
     没付钱的咨询，律师回了也可能白回 —— 这是律师侧独有的信息，
     用户侧的会话列表里没有，也不该有。

   ★ 聊天页复用 17-chat（用户视角），律师视角的差异（底部按钮、
     顶部展示对象）留到代码层按角色切换。设计稿这一批不另开一屏，
     避免同一套气泡组件分叉成两份。
   ========================================================================== */

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 0 0 var(--sp-xl);
}
.screen::-webkit-scrollbar {
  display: none;
}

/* ---------- 排序说明 ---------- */
.sort-note {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: var(--sp-sm) var(--sp-xl) 0;
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
}

.sort-note svg {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
}

/* ---------- 会话条目 ---------- */
.chat-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: var(--sp-md) var(--sp-xl) 0;
}

.chat-item {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-md);
  padding: var(--sp-md) var(--sp-lg);
  border-radius: var(--r-md);
  background: var(--bg-surface);
  box-shadow: var(--shadow-card);
  text-decoration: none;
  color: inherit;
}

/* 未读的会话左侧一道主色竖条：整页扫下来先看到它 */
.chat-item--unread {
  box-shadow: var(--shadow-card), inset 3px 0 0 var(--brand-primary);
}

.chat-item__avatar {
  flex: 0 0 auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--bg-input);
  color: var(--text-muted);
}

.chat-item__avatar svg {
  width: 24px;
  height: 24px;
}

.chat-item__badge {
  position: absolute;
  inset-block-start: -2px;
  inset-inline-end: -2px;
  min-width: 17px;
  height: 17px;
  padding-inline: 4px;
  border-radius: var(--r-pill);
  background: var(--state-danger);
  color: var(--text-on-brand);
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  font-weight: var(--fw-bold);
  line-height: 17px;
  text-align: center;
}

.chat-item__body {
  flex: 1 1 0;
  min-width: 0;
}

.chat-item__top {
  display: flex;
  align-items: baseline;
  gap: var(--sp-sm);
}

.chat-item__name {
  flex: 0 0 auto;
  font-size: var(--fs-lg);
  font-weight: var(--fw-medium);
  color: var(--text-primary);
  line-height: 1.4;
}

/* 订单状态：已付款用青、未付款用暖色。这一条是律师最先找的信息 */
.chat-item__pay {
  flex: 0 0 auto;
  padding: 1px 6px;
  border-radius: var(--r-xs);
  font-size: var(--fs-micro);
  line-height: 1.5;
}

.chat-item__pay--paid {
  background: var(--state-success-soft);
  color: var(--state-success);
}

.chat-item__pay--unpaid {
  background: var(--state-warning-soft);
  color: var(--state-warning-deep);
}

.chat-item__time {
  flex: 0 0 auto;
  margin-inline-start: auto;
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  color: var(--text-muted);
}

.chat-item__msg {
  display: block;
  margin-block-start: 4px;
  font-size: var(--fs-caption);
  color: var(--text-secondary);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 未读消息的摘要加粗：视觉上也要和已读分开，不能只靠角标 */
.chat-item--unread .chat-item__msg {
  color: var(--text-body);
  font-weight: var(--fw-medium);
}

/* ---------- 底部加载 ---------- */
.loadmore {
  margin-block-start: var(--sp-sm);
}

/* ---------- 空态 / 错误态 ---------- */
.state-wrap {
  padding-block: var(--sp-huge) var(--sp-xxxl);
}
</style>
</head>
<body>

<div class="navbar navbar--dark">

</body>
