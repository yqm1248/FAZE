# ══════════════════════════════════════════════════════════════════
# 法泽 FAZE 生产配置（prod profile）
# 默认拒绝：JWT 密钥不提供默认值，未设置 FAZE_TOKEN_SECRET 即启动失败
# 探针接口在 prod 下不注册（@Profile("!prod")），避免无鉴权消耗豆包配额
# ══════════════════════════════════════════════════════════════════
faze:
  jwt:
    secret: ${FAZE_TOKEN_SECRET}
  ai:
    # 第 3 段 C1：生产**一律走真实豆包**（mock 只用于本地开发自测）。
    # 显式 false 而不是省略：万一有人把 FAZE_AI_MOCK=true 带进生产环境变量，
    # 这里也会把它覆盖成 false——生产绝不能出现「mock 回答被当成 AI 回答」。
    mock: false
  probe:
    ai:
      mock: false

logging:
  level:
    com.faze: INFO
