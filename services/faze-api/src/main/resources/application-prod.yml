# ══════════════════════════════════════════════════════════════════
# 法泽 FAZE 生产配置（prod profile）
# 默认拒绝：JWT 密钥不提供默认值，未设置 FAZE_TOKEN_SECRET 即启动失败
# 探针接口在 prod 下不注册（@Profile("!prod")），避免无鉴权消耗豆包配额
# ══════════════════════════════════════════════════════════════════
faze:
  jwt:
    secret: ${FAZE_TOKEN_SECRET}
  crypto:
    # 两把密钥都必须由环境变量提供，**不提供默认值**（默认拒绝）。
    # id-card-key 从段 1 起就是 CryptoService 的必需项，但 prod 此前缺这一段 →
    # 生产 profile 下 CryptoService 会因占位符解析失败而起不来；段 6 一并补上，
    # 同时新增 config-key（支付渠道密钥专用，见 infra/crypto/ConfigCipher）。
    id-card-key: ${FAZE_IDCARD_SECRET}
    config-key: ${FAZE_CONFIG_SECRET}
  ai:
    # 第 3 段 C1：生产**一律走真实豆包**（mock 只用于本地开发自测）。
    # 显式 false 而不是省略：万一有人把 FAZE_AI_MOCK=true 带进生产环境变量，
    # 这里也会把它覆盖成 false——生产绝不能出现「mock 回答被当成 AI 回答」。
    mock: false
  backup:
    # 备份最后成功时间的文件（第 7 段 G1 的 faze_backup_last_success_timestamp 与
    # OpsHealthService 的「备份新鲜度」都读它）。
    # **生产必须显式注入绝对路径，不提供默认值**（默认拒绝）：相对路径按进程工作目录解析，
    # 由部署脚本从哪个目录启动就会飘到哪，表现为 gauge 恒 0 → FazeBackupStale 一直告警。
    # 备份脚本写哪个文件，这里就配哪个。
    last-success-file: ${FAZE_BACKUP_LAST_SUCCESS_FILE}
  probe:
    ai:
      mock: false

logging:
  level:
    com.faze: INFO
