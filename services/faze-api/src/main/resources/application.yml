# ══════════════════════════════════════════════════════════════════
# 法泽 FAZE 服务端主配置（段 0）
# 口令与密钥一律走环境变量，本文件不写任何真实凭据
# 启动方式：deploy/start-api.ps1（读 deploy/.env 后注入环境变量再启动）
# ══════════════════════════════════════════════════════════════════
server:
  port: ${FAZE_API_PORT:8081}

spring:
  application:
    name: faze-api
  autoconfigure:
    # 排除 Spring Security 的「自动生成内存用户」：本项目用自定义 JWT 过滤器链，
    # 不需要 UserDetailsService。不排除的话，启动日志会打印
    # "Using generated security password: <random>"，生产环境出现这行本身就是隐患
    # （2026-11-03 实测：prod profile 启动时确实打印过）。
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # 404 也要回 JSON：不抛异常的 404 会被 ResourceHttpRequestHandler 吞掉、回 Tomcat 的 HTML 页，
  # 客户端解析不了。这两条配置（throw-exception + 关静态资源映射）缺一条都不生效。
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 段 0 服务端是纯 API，没有静态资源；开着会把 /api/** 的 404 变成静态资源 404
      add-mappings: false
  # 第 3 段 H1：A-27 法条「批量导入」允许 multipart 上传 JSON 文件（≤5MB，工作流 H1 第 3 条）。
  # Boot 默认 max-file-size 只有 1MB，不配这两项时 5MB 文件会在进 Controller 前被容器拒掉
  # （表现是 501001「服务器内部错误」，不是业务错误，排查时容易误判）。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${FAZE_DB_URL}
    username: ${FAZE_DB_USER}
    # 默认拒绝：不提供默认口令，未设置时启动失败（后端规范 §12.3.1）
    password: ${FAZE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 库必须由 database/00-create-database.sql 先建好
    baseline-on-migrate: false
    validate-on-migrate: true
    # 本地也不许 clean；要 clean 用单独的 reset-db.ps1
    clean-disabled: true
    # ── 迁移走独立的 faze_migrate 账号（第 1 段收口补）──────────────────
    # 《审计与日志规范》要求 operation_log 只追加、DB 账号无 UPDATE/DELETE；
    # MySQL 权限是并集，只能把 DDL（迁移）与 DML（运行）拆成两个账号。
    # 运行时账号 faze_app 已无 CREATE/DROP/ALTER，所以**不配这三项 Flyway 一定失败**
    # （回落到 datasource 的 faze_app → 建表权限拒绝）。
    # 注意：Spring Boot 里 spring.flyway.user 不配置时会回落到 spring.datasource.username，
    # 那是隐式降级，不符合「默认拒绝」，所以这里显式写、且不提供默认值。
    url: ${FAZE_DB_URL}
    user: ${FAZE_DB_MIGRATE_USER}
    password: ${FAZE_DB_MIGRATE_PASSWORD}
  # 定时任务调度：pool-size 必须显式配（默认 1 个线程，所有 @Scheduled 串行，
  # 一个慢任务会把扫单任务饿死，表现是「订单不自动关闭」且日志无异常）。
  # 用 Boot 的配置项而不是自定义 ThreadPoolTaskScheduler bean：自定义会与自动配置
  # 各注册一个 TaskExecutor，ProbeController 注入 TaskExecutor 时歧义导致启动失败。
  task:
    scheduling:
      pool:
        size: 10
      thread-name-prefix: faze-task-
  jackson:
    default-property-inclusion: always
    # 2026-11-02 复核：Spring Boot 4 已换 Jackson 3（tools.jackson），
    # Jackson 2 的 serialization.* 键（如 write-dates-as-timestamps）不再存在，不要写。
    # Jackson 3 默认不把日期写时间戳（ISO-8601），符合项目要求。

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

faze:
  jwt:
    # 生产必须由环境变量提供；dev 在 application-dev.yml 里有本地默认值
    secret: ${FAZE_TOKEN_SECRET:}
    access-ttl-minutes: 120
    refresh-ttl-days: 30
  probe:
    ai:
      mock: ${FAZE_PROBE_AI_MOCK:true}
      api-key: ${FAZE_DOUBAO_API_KEY:}
      base-url: ${FAZE_DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      # 推理接入点 ID（形如 ep-xxxxxxxx），不是模型名字；用错会 404
      model: ${FAZE_DOUBAO_MODEL:}
      timeout-seconds: 120
  api:
    # 对外可访问的服务地址，用于拼本地存储的签名 URL；
    # 接云 OSS 后本项只在「本地开发想用局域网 IP 联调」时还有意义
    public-base-url: ${FAZE_PUBLIC_BASE_URL:http://127.0.0.1:8081}
  admin-auth:
    # ── 管理端鉴权桥（第 1 段 F1，方案 A：与 RuoYi 共享 token.secret + 共享 Redis）──
    # token-secret 必须与 RuoYi-Vue 的 token.secret **完全一致**，两边各写一份一定漂移；
    # 生产由 FAZE_ADMIN_TOKEN_SECRET 注入，未设置即启动失败（默认拒绝）
    enabled: ${FAZE_ADMIN_AUTH_ENABLED:true}
    token-secret: ${FAZE_ADMIN_TOKEN_SECRET:}
    # 指向 RuoYi 用的那个 Redis 逻辑库（默认 0），不是 faze 业务缓存库（1）
    redis-host: ${FAZE_REDIS_HOST:127.0.0.1}
    redis-port: ${FAZE_REDIS_PORT:6379}
    redis-password: ${FAZE_REDIS_PASSWORD:}
    redis-database: ${FAZE_ADMIN_REDIS_DATABASE:0}
    # 取自 RuoYi 的 CacheConstants.LOGIN_TOKEN_KEY，改了这里就读不到登录态
    token-key-prefix: "login_tokens:"
  storage:
    # 本段是本地目录实现（负责人 2026-11-04 选方案 B），文件落在仓库之外；
    # 段 4 换云 OSS 时只替换 FileStorage 的实现类，本配置项删除
    base-dir: ${FAZE_FILE_BASE_DIR:E:/dshcode/faze-files}
    sign-secret: ${FAZE_FILE_SIGN_SECRET:faze-local-file-sign-secret-0123456789}
    download-ttl-seconds: 60
    upload-ttl-seconds: 300
    # 单文件上限 10MB，与 C1 风险项「签名里限 content-length-range」对应
    max-upload-bytes: 10485760
  doc:
    # ── 文书渲染（段 4 A2）──
    # 中文正文字体：仿宋（Windows 自带 simfang.ttf）。
    # **不用「仿宋_GB2312」**——系统不自带，配错的表现是 PDF 里全是方块且不报错。
    # 生产由 FAZE_FONT_PATH 注入；为空时 PdfRenderer 构造期直接拒绝启动（默认拒绝，不给"看起来能跑"的默认值）
    font-path: ${FAZE_FONT_PATH:}
    # 粗体：仿宋只有 Regular，用黑体承担 700 字重；未配置时标题不加粗（渲染照常，不阻断生成）
    bold-font-path: ${FAZE_BOLD_FONT_PATH:}
    # 单次渲染上限：畸形 HTML（超深嵌套）会把渲染线程卡死，必须有上限
    render-timeout-seconds: 10
    # 页数上限兜底（超时中断不一定生效，用页数再兜一层）
    max-pages: 200

  # ── 导出目录（第 7 段 F4）────────────────────────────────────────────
  # 本机目录存储是「云 OSS 未就绪」时的降级出口（工作流 F4 卡住怎么办已允许）。
  # 同步导出行数上限 5000 与《审计与日志规范》§6.3 一致，**不要在这里调大**：
  # 调大等于把「>5000 转异步」的验收条件改没了。下载链接默认 24 小时过期。
  export:
    dir: ${FAZE_EXPORT_DIR:E:/faze-export}
    # 5000 是《审计与日志规范》§6.3 的口径；支持环境变量覆盖**只为验收时把阈值调小**
    # （不用往库里灌 6000 行也能证明「>阈值 → 410015 + taskId → 异步落文件 → 下载」）。
    # 生产不要设这个变量，保持默认 5000。
    sync-max-rows: ${FAZE_EXPORT_SYNC_MAX_ROWS:5000}
    expire-hours: 24

logging:
  level:
    root: INFO
    com.faze: INFO

# ── 监控（第 7 段 G1）──────────────────────────────────────────────────
# 1. 只暴露 4 个端点：health / info / prometheus / metrics。
#    **不要 include: "*"**：一旦全开，`/actuator/env`、`/actuator/heapdump`
#    就能读到环境变量（含数据库口令）或下载堆转储，等于把服务器交出去。
#    `7-A7` 的验收项之一就是「/actuator/env 不可访问（403 或 404）」。
# 2. **actuator 与业务同端口（8081）**，因此**不能**配 `management.server.address`：
#    Spring Boot 4 实测会在启动期直接抛
#    `IllegalStateException: Management-specific server address cannot be configured as
#    the management server is not listening on a separate port`（2026-11-09 实测，
#    43 个测试上下文全部因此加载失败）。工作流 G1 写的「management.server.address=127.0.0.1」
#    在「同端口」前提下不成立；要真正只绑本机必须给 management 开独立端口（8082），
#    而那会破坏 T4 的 Prometheus 抓取地址约定（127.0.0.1:8081/actuator/prometheus）。
#    **所以「不裸奔」由 SecurityConfig 保证**：`/actuator/**` 本机（127.0.0.1/::1）免鉴权，
#    非本机要求 ROLE_ADMIN；且只 include 4 个端点（env/heapdump 未暴露 → 404）。
#    这是一处与工作流字面口径的偏差，已记进第 7 段 §十一 待回写项。
# 3. Prometheus 抓取不能带 JWT（token 会过期），所以本机（127.0.0.1）免鉴权；
#    外网访问仍要求 ROLE_ADMIN。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # 不向匿名调用方暴露数据库/Redis 细节（只给 UP/DOWN）
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: faze-api
