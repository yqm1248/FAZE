# 数据源配置
# 2026-11-13：库口令与 Druid 控制台凭据改成环境变量可覆盖（W13 / 盲测 S51）。
#   本机不设环境变量时仍用下面的默认值，保证 clone 下来直接能跑；
#   生产/测试环境必须由部署脚本注入 FAZE_ADMIN_DB_PASSWORD / FAZE_DRUID_PASSWORD。
#   改动已登记 docs/analysis/ruoyi-patches.md 第 12 条。
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://localhost:3306/faze_admin?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
                username: ${FAZE_ADMIN_DB_USER:root}
                password: '${FAZE_ADMIN_DB_PASSWORD:123456}'
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问。
                # **必须填**：控制台能看到全部 SQL、数据源连接串与会话，等于数据库后门。
                # 2026-11-13 前这里是空的，任何人打开 /druid/login.html 输 ruoyi/123456 即可进（盲测 S51）。
                # 多网段/多运维 IP 时用逗号分隔，如 "127.0.0.1,10.0.0.5"。
                # 生产若不需要，把 enabled 置 false 最干净。
                allow: ${FAZE_DRUID_ALLOW:127.0.0.1}
                url-pattern: /druid/*
                # 控制台管理用户名和密码（环境变量覆盖，默认值只用于本机开发）
                login-username: '${FAZE_DRUID_USER:faze-admin}'
                login-password: '${FAZE_DRUID_PASSWORD:faze-druid-local-only}'
                # 关闭「重置全部统计」按钮：它会把监控数据清零，掩盖真实压力
                resetEnable: false
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true